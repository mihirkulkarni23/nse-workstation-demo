name: Demo checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  producer-standard-library:
    # The laptop producer must run with no third-party packages installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pandas') is not None)"
      - run: python -m producer.synthetic --output-dir "$RUNNER_TEMP/synthetic-export"
