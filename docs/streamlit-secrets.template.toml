# Streamlit Secrets template for drive_snapshot mode. PLACEHOLDERS ONLY. Never put real values in this file.
#
# Copy this text into Streamlit Community Cloud: your app > Settings > Secrets. Replace every value
# that contains REPLACE with the matching field from the service account's JSON key file (open the key
# file in Notepad on your own computer). Do not paste the key into chat, email, GitHub or this repository.
#
# The dashboard refuses to start while any REPLACE placeholder remains; it never falls back to demo data.

NSE_DATA_MODE = "drive_snapshot"

[drive_reader]
# From the Drive folder's address: https://drive.google.com/drive/folders/<this part>
folder_id = "REPLACE_WITH_DRIVE_FOLDER_ID"

[drive_reader.service_account]
# Copy each value from the JSON key file. Keep the quotes. Copy private_key exactly as it appears in the
# file, on one line, including -----BEGIN PRIVATE KEY----- / -----END PRIVATE KEY----- and every \n.
type = "service_account"
project_id = "REPLACE_WITH_project_id"
private_key_id = "REPLACE_WITH_private_key_id"
private_key = "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_THE_KEY_FROM_THE_JSON_FILE\n-----END PRIVATE KEY-----\n"
client_email = "REPLACE_WITH_client_email"
client_id = "REPLACE_WITH_client_id"
token_uri = "https://oauth2.googleapis.com/token"
