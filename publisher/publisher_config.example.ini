; NSE snapshot publisher settings.
; Copy this file to publisher_config.ini (in the same folder) and replace every path below.
; Tip: in File Explorer, hold Shift, right-click a file and choose "Copy as path". Quotes are fine.
; The publisher only READS the six files. It never changes them or the trading application.

[sources]
; The six CSV files written by the trading application. Give the full path to each file.
scanner_30m_signals = C:\PATH\TO\TRADING\APP\scanner_30m_signals.csv
hourly_signal_scan = C:\PATH\TO\TRADING\APP\hourly_signal_scan.csv
daily_signal_scan = C:\PATH\TO\TRADING\APP\daily_signal_scan.csv
open_positions = C:\PATH\TO\TRADING\APP\open_positions.csv
closed_positions = C:\PATH\TO\TRADING\APP\closed_positions.csv
daily_equity = C:\PATH\TO\TRADING\APP\daily_equity.csv

[output]
; A NEW, empty folder of its own, not inside the trading application's folders and not inside a
; cloud-synced folder (Google Drive, OneDrive, Dropbox). Snapshots and upload files are written here.
folder = C:\NSE-Snapshot-Publisher-output

[checks]
; A file changed more recently than this is treated as still being written, and the run stops safely.
settle_seconds = 60
; Seconds between two looks at the files; any change in between stops the run safely.
recheck_seconds = 5
